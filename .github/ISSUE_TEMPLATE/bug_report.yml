name: Bug Report
description: Report a crash, layout glitch, or unexpected behavior in IronPath
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version & OS version
      placeholder: e.g. IronPath 0.4.0, Android 15 (Pixel 8)
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs (optional)
      description: Drag and drop screenshots if helpful.
