name: Feature Request / Exercise Suggestion
description: Propose a new feature, exercise, workout plan, or translation
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: Describe the feature, exercise, or improvement and why it helps your training.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Additional details (optional)
      description: Mockups, muscle groups, equipment requirements, or references.
